<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Cimmerian: The Pits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b0a09; --bone: #e8dcc0; --bone-dim: #a39a85; --scarlet: #c4302b; --scarlet-dk: #5a0f0c;
    --jade: #7fa88a; --fire: #ffd27a; --panel: rgba(11, 10, 9, 0.86); --edge: #4a4236;
  }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
  body { font-family: 'Libre Caslon Text', Georgia, serif; color: var(--bone); user-select: none; }
  canvas#gl { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 1px 1px 1px #000, 0 0 8px rgba(0,0,0,.8); }
  #hud.hidden { display: none; }

  #log { position: absolute; left: 0; top: 0; width: min(56ch, 50vw); max-height: 34vh; overflow: hidden; padding: 12px 40px 14px 16px;
    display: flex; flex-direction: column; justify-content: flex-end; font-size: 14px; line-height: 1.3;
    color: rgba(196, 184, 158, 0.7); background: linear-gradient(100deg, rgba(0,0,0,0.5), rgba(0,0,0,0.22) 60%, transparent);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 22%); mask-image: linear-gradient(to bottom, transparent, #000 22%); }
  #log .line { margin: 0 0 5px; }   /* faded by game time in fadeLog() */
  #log .title { color: #9c3a31; font-variant: small-caps; letter-spacing: 2px; font-size: 16px; margin-top: 6px; }
  #log .good { color: rgba(232, 208, 150, 0.9); } #log .bad { color: rgba(238, 132, 104, 0.92); } #log .warn { color: rgba(240, 196, 120, 0.9); }
  #log .dim { color: rgba(163, 154, 133, 0.85); font-style: italic; } #log .clue { color: rgba(140, 186, 152, 0.92); font-style: italic; }
  #log .voice { color: rgba(206, 178, 214, 0.9); font-style: italic; }
  @keyframes logfade { to { opacity: 0; } }

  #loc { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); text-align: center; }
  #locName { font-size: 17px; font-variant: small-caps; letter-spacing: 3px; color: rgba(214, 200, 172, 0.66); }
  #objective { font-size: 13px; font-style: italic; color: rgba(163, 154, 133, 0.62); margin-top: 2px; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; background: var(--bone); opacity: .6; }
  #prompt { position: absolute; left: 50%; top: calc(50% + 30px); transform: translateX(-50%); font-size: 16px; color: rgba(220, 206, 178, 0.72); white-space: nowrap; }
  #status { position: absolute; left: 16px; bottom: 14px; font-size: 14px; letter-spacing: 2px; font-variant: small-caps; opacity: 0.75; }
  .bar { width: 200px; height: 10px; border: 1px solid var(--edge); background: #120c08; margin: 3px 0 0; }
  .bar > div { height: 100%; background: linear-gradient(var(--scarlet), var(--scarlet-dk)); }
  .invbox { text-align: left; margin: 10px auto 14px; max-width: 520px; border: 1px solid var(--edge); background: rgba(18,12,8,.6); padding: 8px 12px; }
  .invt { font-variant: small-caps; letter-spacing: 2px; color: #d8a24a; margin-bottom: 6px; } .invt span { color: #b8a888; letter-spacing: 0; font-variant: normal; font-size: 13px; margin-left: 8px; }
  .invrow { display: flex; align-items: center; gap: 8px; padding: 3px 0; border-top: 1px solid rgba(120,90,60,.25); }
  .invn { width: 26px; color: #d8c8a8; } .invl { flex: 1; } .invl.pot { color: #e8c060; } .invh { font-size: 12px; opacity: .7; width: 210px; }
  .invrow button { padding: 2px 10px; font-size: 13px; } .invempty, .invarms { font-size: 13px; opacity: .75; padding-top: 4px; }
  #minimap { position: absolute; top: 14px; right: 16px; width: 176px; height: 176px; border-radius: 50%; border: 2px solid rgba(160,120,70,.55); box-shadow: 0 0 12px rgba(0,0,0,.8); background: rgba(10,8,6,.55); }
  @media (max-width: 700px) { #minimap { width: 110px; height: 110px; } }
  #boss { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); text-align: center; display: none; font-variant: small-caps; letter-spacing: 2px; color: #d8c8a8; text-shadow: 0 1px 2px #000; }
  #boss .bar { width: 360px; height: 8px; margin: 4px auto 0; }
  #carry { position: absolute; right: 16px; bottom: 14px; font-size: 14px; font-style: italic; color: rgba(163, 154, 133, 0.65); text-align: right; }
  #debug { position: absolute; left: 16px; bottom: 60px; font: 12px ui-monospace, Menlo, monospace; color: var(--jade); white-space: pre; display: none; }

  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.6); padding: 16px; box-sizing: border-box; }
  #overlay.hidden { display: none; }
  .panel { background: var(--panel); border: 1px solid var(--edge); padding: 22px 30px; max-width: 640px; width: 100%; box-sizing: border-box; max-height: 92vh; overflow: auto; }
  .panel h2 { font-size: 30px; margin: 0 0 8px; color: var(--scarlet); font-variant: small-caps; letter-spacing: 2px; font-weight: 400; }
  .panel p { font-size: 16px; line-height: 1.45; margin: 10px 0; }
  .sub { color: var(--bone-dim); font-size: 14px; font-style: italic; }
  .keys { font-size: 14px; line-height: 1.8; color: var(--bone-dim); margin: 12px 0; }
  .keys b { color: var(--bone); font-weight: 400; font-variant: small-caps; letter-spacing: 1px; }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  button { font: inherit; font-size: 16px; background: #1a1612; color: var(--bone); border: 1px solid #6b5f4c; padding: 6px 18px; cursor: pointer; }
  button:hover { background: #2a221a; border-color: var(--scarlet); }
  .setting { display: flex; align-items: center; gap: 14px; font-size: 15px; margin: 8px 0 4px; flex-wrap: wrap; }
  .setting input[type=range] { flex: 1; min-width: 160px; accent-color: var(--scarlet); cursor: pointer; }

  /* splash: engraved art fills the screen, text set below it like a plate caption */
  #overlay.splash { background: var(--ink); padding: 0; flex-direction: column; justify-content: flex-end; }
  #splashArt { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  /* level plates (public-domain paintings and etchings, art/): the title card's slow push-in and embers */
  #overlay.splash.plate #splashArt { opacity: 0; transform-origin: 50% 40%; animation: plateIn 16s ease-out forwards; }
  #overlay.splash.plate #embers { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: screen; }
  #overlay.splash.plate .platecredit { position: absolute; right: 14px; top: 10px; font-size: 11px; font-style: italic; color: #8a7a62; }
  #overlay.splash.plate .splashText { background: linear-gradient(to bottom, rgba(11,10,9,0), rgba(11,10,9,0.78) 30%, rgba(11,10,9,0.94)); }
  #overlay.splash.plate .splashText p.closing { font-style: italic; color: #cbbd9c; }
  #overlay.splash.plate .splashText p.fin { font-variant: small-caps; letter-spacing: 0.3em; color: #9c3a31; margin-top: 16px; }
  @keyframes plateIn { 0% { opacity: 0; transform: scale(1.0); } 14% { opacity: 0.9; } 100% { opacity: 0.9; transform: scale(1.07); } }
  .splashText { position: relative; width: 100%; padding: 90px max(20px, calc(50% - 380px)) 26px; box-sizing: border-box; text-align: center;
    background: linear-gradient(to bottom, rgba(11,10,9,0), rgba(11,10,9,0.86) 34%, rgba(11,10,9,0.96)); }
  .splashText .map { font: 12px ui-monospace, Menlo, monospace; color: var(--bone-dim); letter-spacing: 3px; }
  .splashText h1 { font-weight: 400; font-size: clamp(30px, 6vw, 54px); letter-spacing: 6px; margin: 4px 0 10px; color: var(--scarlet); }
  .splashText p { font-size: clamp(14px, 2.2vw, 17px); line-height: 1.5; margin: 0 auto 10px; }
  .splashText .stats { font: 13px ui-monospace, Menlo, monospace; color: var(--jade); }
  .splashText .go { margin-top: 12px; font-style: italic; color: var(--bone-dim); animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  /* the title card: five seconds of storm and embers before the story */
  #overlay.titlecard { background: #000; padding: 0; overflow: hidden; }
  #overlay.titlecard #splashArt { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0;
    animation: tcArt 5s ease-out forwards; }
  #overlay.titlecard #embers { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: screen; }
  #overlay.titlecard .tccredit { position: absolute; right: 14px; bottom: 10px; font-size: 11px; font-style: italic; color: #8a7a62; animation: tcFade 5s ease-in-out forwards; }
  #overlay.titlecard .tc { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-62%); text-align: center; pointer-events: none;
    text-shadow: 0 0 18px #000, 0 0 40px #000, 3px 3px 0 #000; animation: tcFade 5s ease-in-out forwards; }
  .tc1 { font-weight: 700; font-size: clamp(34px, 7vw, 96px); letter-spacing: 0.08em; color: #c4302b; animation: tcSpread 5s ease-out forwards; }
  .tc2 { font-size: clamp(16px, 2.6vw, 30px); font-variant: small-caps; letter-spacing: 0.4em; color: #e8dcc0; margin-top: 6px; }
  .tc3 { font-size: clamp(12px, 1.6vw, 17px); font-style: italic; color: #a39a85; margin-top: 14px; }
  @keyframes tcArt { 0% { opacity: 0; transform: scale(1.0); } 20% { opacity: 0.85; } 82% { opacity: 0.85; } 100% { opacity: 0; transform: scale(1.07); } }
  @keyframes tcFade { 0%, 8% { opacity: 0; } 30% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes tcSpread { 0% { letter-spacing: 0.02em; filter: blur(6px); } 35% { filter: blur(0); } 100% { letter-spacing: 0.14em; } }
  @media (max-width: 700px) { #log { width: calc(100vw - 32px); font-size: 13px; max-height: 40vh; } #loc { top: auto; bottom: 60px; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud" class="hidden">
  <div id="log"></div>
  <div id="loc"><div id="locName"></div><div id="objective"></div></div>
  <div id="crosshair"></div>
  <div id="prompt"></div>
  <div id="debug"></div>
  <div id="status"><div>health <span id="hpNum">100</span></div><div class="bar"><div id="hpFill"></div></div></div>
  <div id="carry"></div>
  <canvas id="minimap" width="176" height="176"></canvas>
  <div id="boss"><div id="bossName"></div><div class="bar"><div id="bossFill"></div></div></div>
</div>
<div id="overlay"><div class="panel"><h2>Loading the pits...</h2></div></div>
