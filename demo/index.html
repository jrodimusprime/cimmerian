<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Cimmerian: The Pits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b0a09; --bone: #e8dcc0; --bone-dim: #a39a85; --scarlet: #c4302b; --scarlet-dk: #5a0f0c;
    --jade: #7fa88a; --fire: #ffd27a; --panel: rgba(11, 10, 9, 0.86); --edge: #4a4236;
  }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
  body { font-family: 'Libre Caslon Text', Georgia, serif; color: var(--bone); user-select: none; }
  canvas#gl { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 1px 1px 0 #000, 0 0 6px #000; }
  #hud.hidden { display: none; }

  #log { position: absolute; left: 16px; top: 12px; width: min(54ch, 48vw); max-height: 52vh; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end; font-size: 15px; line-height: 1.32; }
  #log .line { margin: 0 0 6px; animation: logfade 2s linear 28s forwards; }
  #log .title { color: var(--scarlet); font-variant: small-caps; letter-spacing: 2px; font-size: 18px; margin-top: 6px; }
  #log .good { color: #f0d9a0; } #log .bad { color: #ff8a6e; } #log .warn { color: var(--fire); }
  #log .dim { color: var(--bone-dim); font-style: italic; } #log .clue { color: var(--jade); font-style: italic; }
  #log .voice { color: #d8b8e0; font-style: italic; }
  @keyframes logfade { to { opacity: 0; } }

  #loc { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); text-align: center; }
  #locName { font-size: 20px; font-variant: small-caps; letter-spacing: 3px; color: var(--bone); }
  #objective { font-size: 14px; font-style: italic; color: var(--bone-dim); margin-top: 2px; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; background: var(--bone); opacity: .6; }
  #prompt { position: absolute; left: 50%; top: calc(50% + 30px); transform: translateX(-50%); font-size: 17px; color: var(--bone); white-space: nowrap; }
  #status { position: absolute; left: 16px; bottom: 14px; font-size: 14px; letter-spacing: 2px; font-variant: small-caps; }
  .bar { width: 200px; height: 10px; border: 1px solid var(--edge); background: #120c08; margin: 3px 0 0; }
  .bar > div { height: 100%; background: linear-gradient(var(--scarlet), var(--scarlet-dk)); }
  #carry { position: absolute; right: 16px; bottom: 14px; font-size: 15px; font-style: italic; color: var(--bone-dim); text-align: right; }
  #debug { position: absolute; left: 16px; bottom: 60px; font: 12px ui-monospace, Menlo, monospace; color: var(--jade); white-space: pre; display: none; }

  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.6); padding: 16px; box-sizing: border-box; }
  #overlay.hidden { display: none; }
  .panel { background: var(--panel); border: 1px solid var(--edge); padding: 22px 30px; max-width: 640px; width: 100%; box-sizing: border-box; max-height: 92vh; overflow: auto; }
  .panel h2 { font-size: 30px; margin: 0 0 8px; color: var(--scarlet); font-variant: small-caps; letter-spacing: 2px; font-weight: 400; }
  .panel p { font-size: 16px; line-height: 1.45; margin: 10px 0; }
  .sub { color: var(--bone-dim); font-size: 14px; font-style: italic; }
  .keys { font-size: 14px; line-height: 1.8; color: var(--bone-dim); margin: 12px 0; }
  .keys b { color: var(--bone); font-weight: 400; font-variant: small-caps; letter-spacing: 1px; }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  button { font: inherit; font-size: 16px; background: #1a1612; color: var(--bone); border: 1px solid #6b5f4c; padding: 6px 18px; cursor: pointer; }
  button:hover { background: #2a221a; border-color: var(--scarlet); }
  .setting { display: flex; align-items: center; gap: 14px; font-size: 15px; margin: 8px 0 4px; flex-wrap: wrap; }
  .setting input[type=range] { flex: 1; min-width: 160px; accent-color: var(--scarlet); cursor: pointer; }

  /* splash: engraved art fills the screen, text set below it like a plate caption */
  #overlay.splash { background: var(--ink); padding: 0; flex-direction: column; justify-content: flex-start; }
  #splashArt { width: 100%; flex: 1 1 auto; min-height: 0; object-fit: cover; image-rendering: pixelated; display: block; }
  .splashText { flex: 0 0 auto; width: 100%; max-width: 760px; padding: 18px 20px 24px; box-sizing: border-box; text-align: center; }
  .splashText .map { font: 12px ui-monospace, Menlo, monospace; color: var(--bone-dim); letter-spacing: 3px; }
  .splashText h1 { font-weight: 400; font-size: clamp(30px, 6vw, 54px); letter-spacing: 6px; margin: 4px 0 10px; color: var(--scarlet); }
  .splashText p { font-size: clamp(14px, 2.2vw, 17px); line-height: 1.5; margin: 0 auto 10px; }
  .splashText .stats { font: 13px ui-monospace, Menlo, monospace; color: var(--jade); }
  .splashText .go { margin-top: 12px; font-style: italic; color: var(--bone-dim); animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  @media (max-width: 700px) { #log { width: calc(100vw - 32px); font-size: 13px; max-height: 40vh; } #loc { top: auto; bottom: 60px; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud" class="hidden">
  <div id="log"></div>
  <div id="loc"><div id="locName"></div><div id="objective"></div></div>
  <div id="crosshair"></div>
  <div id="prompt"></div>
  <div id="debug"></div>
  <div id="status"><div>health <span id="hpNum">100</span></div><div class="bar"><div id="hpFill"></div></div></div>
  <div id="carry"></div>
</div>
<div id="overlay"><div class="panel"><h2>Loading the pits...</h2></div></div>

<script src="js/util.js"></script>
<script src="js/textures.js"></script>
<script src="js/level.js"></script>
<script src="js/mesh.js"></script>
<script src="js/renderer.js"></script>
<script src="js/audio.js"></script>
<script src="js/splash.js"></script>
<script src="js/game.js"></script>
</body>
</html>
